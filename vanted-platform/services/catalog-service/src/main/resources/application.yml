spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://mysql-catalog:3306/vanted_catalog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${CATALOG_DB_USERNAME:vanted}
    password: ${CATALOG_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
