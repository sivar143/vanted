spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://mysql:3306/vanted_order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${ORDER_DB_USERNAME:vanted}
    password: ${ORDER_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${VANTED_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://vanted:change-me@rabbitmq:5672}
server:
  port: ${PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
