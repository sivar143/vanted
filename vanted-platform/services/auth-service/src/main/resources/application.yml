spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://mysql-auth:3306/vanted_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${AUTH_DB_USERNAME:vanted}
    password: ${AUTH_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
