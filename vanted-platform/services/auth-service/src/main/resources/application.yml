spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://mysql:3306/vanted_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${AUTH_DB_USERNAME:vanted}
    password: ${AUTH_DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${VANTED_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

vanted:
  env: ${VANTED_ENV:local}
  local-mode: ${VANTED_LOCAL_MODE:true}
  test-mode: ${VANTED_TEST_MODE:false}
  production-features: ${VANTED_PRODUCTION_FEATURES:false}
  kubernetes-enabled: ${VANTED_KUBERNETES_ENABLED:false}
  auth:
    cookie-secure: ${VANTED_COOKIE_SECURE:false}
    access-token-ttl-seconds: ${VANTED_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${VANTED_REFRESH_TOKEN_TTL_DAYS:30}

VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:change-this-development-secret-at-least-32-characters-long}
