x-vanted-env: &vanted-env
  VANTED_ENV: ${VANTED_ENV:-local}
  VANTED_LOCAL_MODE: ${VANTED_LOCAL_MODE:-true}
  VANTED_TEST_MODE: ${VANTED_TEST_MODE:-false}
  VANTED_PRODUCTION_FEATURES: ${VANTED_PRODUCTION_FEATURES:-false}
  VANTED_KUBERNETES_ENABLED: ${VANTED_KUBERNETES_ENABLED:-false}
  VANTED_DEBUG_FEATURES: ${VANTED_DEBUG_FEATURES:-false}
  VANTED_OBSERVABILITY_ENABLED: ${VANTED_OBSERVABILITY_ENABLED:-false}
  VANTED_REDIS_ENABLED: ${VANTED_REDIS_ENABLED:-true}
  VANTED_RABBITMQ_ENABLED: ${VANTED_RABBITMQ_ENABLED:-true}
  VANTED_EXTERNAL_INTEGRATIONS_ENABLED: ${VANTED_EXTERNAL_INTEGRATIONS_ENABLED:-false}
  VANTED_PAYMENT_MODE: ${VANTED_PAYMENT_MODE:-mock}

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vanted}
      MYSQL_USER: ${MYSQL_USER:-vanted}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test1234}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vanted}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-test1234}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-test1234}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-test1234}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      <<: *vanted-env
      AUTH_DB_URL: jdbc:mysql://mysql:3306/vanted_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      AUTH_DB_USERNAME: ${MYSQL_USER:-vanted}
      AUTH_DB_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:-test1234-test1234-test1234-test1234}
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    restart: unless-stopped
    environment:
      <<: *vanted-env
      CATALOG_DB_URL: jdbc:mysql://mysql:3306/vanted_catalog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      CATALOG_DB_USERNAME: ${MYSQL_USER:-vanted}
      CATALOG_DB_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:-test1234-test1234-test1234-test1234}
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    environment:
      <<: *vanted-env
      ORDER_DB_URL: jdbc:mysql://mysql:3306/vanted_order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ORDER_DB_USERNAME: ${MYSQL_USER:-vanted}
      ORDER_DB_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vanted}:${RABBITMQ_PASSWORD:-test1234}@rabbitmq:5672
      VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:-test1234-test1234-test1234-test1234}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    environment:
      <<: *vanted-env
      PAYMENT_DB_URL: jdbc:mysql://mysql:3306/vanted_payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      PAYMENT_DB_USERNAME: ${MYSQL_USER:-vanted}
      PAYMENT_DB_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vanted}:${RABBITMQ_PASSWORD:-test1234}@rabbitmq:5672
      VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:-test1234-test1234-test1234-test1234}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    environment:
      <<: *vanted-env
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vanted}:${RABBITMQ_PASSWORD:-test1234}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *vanted-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vanted?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-vanted}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-test1234}
      VANTED_JWT_SECRET: ${VANTED_JWT_SECRET:-test1234-test1234-test1234-test1234}
    profiles: [compat]
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - payment-service

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "${VANTED_HTTP_PORT:-8080}:80"
      - "${VANTED_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - catalog-service
      - order-service
      - payment-service

volumes:
  mysql-data:
  rabbitmq-data:
  redis-data:
