spring:
  application:
    name: vanted-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vanted?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:vanted}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${VANTED_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

vanted:
  env: ${VANTED_ENV:local}
  local-mode: ${VANTED_LOCAL_MODE:true}
  test-mode: ${VANTED_TEST_MODE:false}
  production-features: ${VANTED_PRODUCTION_FEATURES:false}
  kubernetes-enabled: ${VANTED_KUBERNETES_ENABLED:false}
  security:
    jwt-secret: ${VANTED_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
