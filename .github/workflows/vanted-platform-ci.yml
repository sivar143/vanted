name: Vanted Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vanted-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: vanted-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, catalog-service, order-service, payment-service, notification-service]
    defaults:
      run:
        working-directory: vanted-platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B -DskipTests=false test
      - run: mvn -B -DskipTests package

  docker-compose:
    runs-on: ubuntu-latest
    needs: [frontend, services]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: vanted-platform
        run: docker compose config --quiet
      - name: Build local images
        working-directory: vanted-platform
        run: docker compose build
